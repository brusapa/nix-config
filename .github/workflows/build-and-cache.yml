name: Build all hosts

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      hosts: ${{ steps.list.outputs.hosts }}
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
      - name: Flake check
        run: nix flake check

      - id: list
        run: |
          echo "hosts=$(nix eval --json .#nixosConfigurations --apply builtins.attrNames)" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJson(needs.check.outputs.hosts) }}
    steps:
      - uses: actions/checkout@v7

      - uses: wimpysworld/nothing-but-nix@687c797a730352432950c707ab493fcc951818d7 # v10
        with:
          hatchet-protocol: 'holster'

      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          # The attic cache is public for reading, so every build can use it
          # without a token, including pull requests from forks
          extra-conf: |
            build-dir = /nix/build
            extra-substituters = https://attic.external.brusapa.com/nix-config https://cache.numtide.com
            extra-trusted-public-keys = nix-config:YSP7WGWUIMS9r389BSYkvixG2mlZMD7l8i6enP7Ms4M= niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=

      # The store path hash covers the host's whole configuration and inputs,
      # so if the cache has it, this exact system was already built and
      # cached by a previous master run. Skip it instead of downloading the
      # whole closure (several GiB) just to confirm it builds. If the cache
      # can't be queried, path-info fails and the host is built as usual.
      - name: Build ${{ matrix.host }}
        env:
          HOST: ${{ matrix.host }}
          CACHE: https://attic.external.brusapa.com/nix-config
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          attr=".#nixosConfigurations.$HOST.config.system.build.toplevel"
          out=$(nix eval --raw "$attr.outPath")
          if nix path-info --store "$CACHE" "$out" >/dev/null 2>&1; then
            echo "$HOST is already in the cache ($out), skipping build"
            exit 0
          fi
          nix build --no-link "$attr"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            # Comprobación 1: el token llega al script
            if [ -z "$ATTIC_TOKEN" ]; then
              echo "::error::ATTIC_TOKEN vacío en este step"
              exit 1
            fi
            echo "ATTIC_TOKEN presente (${#ATTIC_TOKEN} caracteres)"
            nix run nixpkgs#attic-client -- login brusapa https://attic.external.brusapa.com "$ATTIC_TOKEN"
            nix run nixpkgs#attic-client -- push brusapa:nix-config "$out"
          fi

  # Single required status check for branch protection, independent of the
  # host list. Fails if any host build failed or was skipped.
  builds:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check that every host built
        if: needs.build.result != 'success'
        run: |
          echo "Host builds finished with result: ${{ needs.build.result }}"
          exit 1

  # Advance the `deploy` branch that comin deploys from. Only for pushes to
  # master, once every host has built and been pushed to the attic cache.
  promote:
    needs: builds
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: generate-token
        with:
          client-id: ${{ secrets.CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # Full history, so git can verify that the push fast-forwards deploy.
      # With the default shallow clone it rejects the push ("fetch first").
      - uses: actions/checkout@v7
        with:
          token: ${{ steps.generate-token.outputs.token }}
          fetch-depth: 0

      # Not forced: fails instead of rewinding deploy if it ever diverges
      - name: Push to deploy
        run: git push origin "HEAD:refs/heads/deploy"
