name: Build all hosts

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      hosts: ${{ steps.list.outputs.hosts }}
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
      - name: Flake check
        run: nix flake check

      - id: list
        run: |
          echo "hosts=$(nix eval --json .#nixosConfigurations --apply builtins.attrNames)" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJson(needs.check.outputs.hosts) }}
    steps:
      - uses: actions/checkout@v7

      - uses: wimpysworld/nothing-but-nix@687c797a730352432950c707ab493fcc951818d7 # v10
        with:
          hatchet-protocol: 'holster'

      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            build-dir = /nix/build

      - name: Setup Attic cache
        uses: ryanccn/attic-action@dc99f5eb1d5c0495aa26f7b56337b30011fa153e # v0
        with:
          endpoint: https://attic.external.brusapa.com
          cache: nix-config
          token: ${{ secrets.ATTIC_TOKEN }}
          skip-push: ${{ github.event_name != 'push' }}

      - name: Build ${{ matrix.host }}
        run: |
          nix build --no-link ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel"
  # Single required status check for branch protection, independent of the
  # host list. Fails if any host build failed or was skipped.
  builds:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check that every host built
        if: needs.build.result != 'success'
        run: |
          echo "Host builds finished with result: ${{ needs.build.result }}"
          exit 1

  # Advance the `deploy` branch that comin deploys from. Only for pushes to
  # master, once every host has built and been pushed to the attic cache.
  promote:
    needs: builds
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: generate-token
        with:
          client-id: ${{ secrets.CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.generate-token.outputs.token }}

      # Not forced: fails instead of rewinding deploy if it ever diverges
      - name: Push to deploy
        run: git push origin "HEAD:refs/heads/deploy"
